name: Check links

# Runs on GitHub's servers outside mainland China, so it only checks that links
# are alive. "China access" labels are tested by hand (see CONTRIBUTING.md).
on:
  pull_request:
    paths: ["**.md", "lychee.toml"]
  schedule:
    - cron: "0 2 1 * *" # 02:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress './**/*.md'
          # Fail pull requests; on the monthly run, open an issue instead.
          fail: ${{ github.event_name == 'pull_request' }}

      - name: Open an issue for broken links
        if: github.event_name != 'pull_request' && steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links found
          content-filepath: ./lychee/out.md
          labels: broken link
